<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Video Downloader</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-primary: #0f0f23;
        --bg-secondary: #1a1a2e;
        --bg-tertiary: #16213e;
        --accent-primary: #00d4ff;
        --accent-secondary: #7000ff;
        --text-primary: #ffffff;
        --text-secondary: #b0b0b0;
        --success: #00ff88;
        --warning: #ffaa00;
        --error: #ff3366;
        --border: #2a2a3e;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(
          135deg,
          var(--bg-primary) 0%,
          var(--bg-secondary) 100%
        );
        color: var(--text-primary);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 40px;
        padding: 30px;
        background: var(--bg-tertiary);
        border-radius: 20px;
        border: 1px solid var(--border);
        box-shadow: 0 10px 40px rgba(0, 212, 255, 0.1);
      }

      h1 {
        font-size: 2.5rem;
        background: linear-gradient(
          135deg,
          var(--accent-primary),
          var(--accent-secondary)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
      }

      .subtitle {
        color: var(--text-secondary);
        font-size: 1.1rem;
      }

      .main-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }

      @media (max-width: 1024px) {
        .main-content {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--bg-tertiary);
        border-radius: 15px;
        padding: 25px;
        border: 1px solid var(--border);
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }

      .card-title {
        font-size: 1.5rem;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .icon {
        font-size: 1.8rem;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--text-secondary);
        font-weight: 500;
      }

      input[type="text"],
      select {
        width: 100%;
        padding: 12px 15px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 1rem;
        transition: all 0.3s;
      }

      input[type="text"]:focus,
      select:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
      }

      input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
        accent-color: var(--accent-primary);
      }

      .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--accent-primary),
          var(--accent-secondary)
        );
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
      }

      .btn-secondary {
        background: var(--bg-secondary);
        color: var(--text-primary);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover {
        background: var(--border);
      }

      .btn-danger {
        background: var(--error);
        color: white;
      }

      .btn-warning {
        background: var(--warning);
        color: var(--bg-primary);
      }

      .btn-success {
        background: var(--success);
        color: var(--bg-primary);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-small {
        padding: 6px 12px;
        font-size: 0.85rem;
      }

      .queue-list {
        margin-top: 20px;
      }

      .queue-item {
        background: var(--bg-secondary);
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 15px;
        border: 1px solid var(--border);
      }

      .queue-item-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 15px;
        gap: 15px;
      }

      .queue-info {
        flex: 1;
        min-width: 0;
      }

      .queue-url {
        color: var(--accent-primary);
        font-size: 0.9rem;
        margin-bottom: 8px;
        word-wrap: break-word;
        word-break: break-all;
        overflow-wrap: break-word;
        white-space: normal;
        line-height: 1.4;
      }

      .queue-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 10px;
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-bottom: 10px;
      }

      .stat-item {
        display: flex;
        flex-direction: column;
      }

      .stat-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        opacity: 0.7;
        margin-bottom: 2px;
      }

      .stat-value {
        color: var(--text-primary);
        font-weight: 600;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      .queue-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .status-badge {
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .status-queued {
        background: var(--warning);
        color: var(--bg-primary);
      }

      .status-downloading {
        background: var(--accent-primary);
        color: var(--bg-primary);
      }

      .status-completed {
        background: var(--success);
        color: var(--bg-primary);
      }

      .status-failed {
        background: var(--error);
        color: white;
      }

      .status-cancelled {
        background: var(--text-secondary);
        color: var(--bg-primary);
      }

      .progress-bar {
        width: 100%;
        height: 10px;
        background: var(--bg-primary);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 10px;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(
          90deg,
          var(--accent-primary),
          var(--accent-secondary)
        );
        transition: width 0.3s;
        position: relative;
        overflow: hidden;
      }

      .progress-fill::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        animation: shimmer 2s infinite;
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      .history-item {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 15px;
        background: var(--bg-secondary);
        border-radius: 10px;
        margin-bottom: 10px;
        border: 1px solid var(--border);
        transition: all 0.3s;
      }

      .history-item:hover {
        background: var(--border);
        transform: translateX(5px);
      }

      .file-icon {
        font-size: 2rem;
        min-width: 40px;
      }

      .history-info {
        flex: 1;
      }

      .history-filename {
        font-weight: 600;
        margin-bottom: 5px;
        color: var(--text-primary);
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
        line-height: 1.4;
      }

      .history-meta {
        font-size: 0.85rem;
        color: var(--text-secondary);
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      .history-actions {
        display: flex;
        gap: 10px;
      }

      .btn-icon {
        padding: 8px 12px;
        background: var(--bg-tertiary);
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s;
        color: var(--text-primary);
      }

      .btn-icon:hover {
        background: var(--accent-primary);
        color: var(--bg-primary);
      }

      .empty-state {
        text-align: center;
        padding: 40px;
        color: var(--text-secondary);
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      .empty-state-icon {
        font-size: 4rem;
        margin-bottom: 15px;
        opacity: 0.5;
      }

      .alert {
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        word-wrap: break-word;
        overflow-wrap: break-word;
        line-height: 1.5;
      }

      .alert-warning {
        background: rgba(255, 170, 0, 0.1);
        border: 1px solid var(--warning);
        color: var(--warning);
      }

      .alert-error {
        background: rgba(255, 51, 102, 0.1);
        border: 1px solid var(--error);
        color: var(--error);
      }

      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .tab {
        padding: 10px 20px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .tab.active {
        background: var(--accent-primary);
        color: var(--bg-primary);
        font-weight: 600;
      }

      .format-selector {
        display: none;
        margin-top: 15px;
      }

      .format-selector.active {
        display: block;
      }

      .format-item {
        padding: 10px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.3s;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      .format-item:hover {
        border-color: var(--accent-primary);
        background: var(--border);
      }

      .format-item.selected {
        border-color: var(--accent-primary);
        background: rgba(0, 212, 255, 0.1);
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid var(--border);
        border-top-color: var(--accent-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-secondary);
      }

      .notification {
        position: fixed;
        top: 20px;
        right: 20px;
        max-width: 400px;
        padding: 15px 25px;
        background: var(--bg-tertiary);
        border: 1px solid var(--success);
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 255, 136, 0.3);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 1000;
        animation: slideIn 0.3s ease-out;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      @media (max-width: 768px) {
        .notification {
          right: 10px;
          left: 10px;
          max-width: calc(100% - 20px);
        }
      }

      @keyframes slideIn {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .notification.hide {
        animation: slideOut 0.3s ease-in forwards;
      }

      @keyframes slideOut {
        from {
          transform: translateX(0);
          opacity: 1;
        }
        to {
          transform: translateX(400px);
          opacity: 0;
        }
      }

      .notification-icon {
        font-size: 1.5rem;
      }

      .notification-content {
        flex: 1;
      }

      .notification-title {
        font-weight: 600;
        margin-bottom: 3px;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      .notification-message {
        font-size: 0.85rem;
        color: var(--text-secondary);
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🎬 Universal Video Downloader</h1>
        <p class="subtitle">
          Download videos and audio from any website with parallel processing
        </p>
      </header>

      <div id="dependencies-alert"></div>

      <div class="main-content">
        <!-- Download Form -->
        <div class="card">
          <h2 class="card-title">
            <span class="icon">📥</span>
            New Download
          </h2>

          <form id="download-form">
            <div class="form-group">
              <label>Video URL</label>
              <input
                type="text"
                id="url"
                placeholder="https://example.com/video"
                required
              />
            </div>

            <div class="tabs">
              <div class="tab active" data-type="video">🎬 Video</div>
              <div class="tab" data-type="audio">🎵 Audio (MP3)</div>
            </div>

            <div class="checkbox-group">
              <input type="checkbox" id="use-sponsorblock" />
              <label for="use-sponsorblock" style="margin: 0"
                >Remove sponsors/ads (SponsorBlock)</label
              >
            </div>

            <div class="form-group">
              <label>Proxy (optional)</label>
              <select id="proxy">
                <option value="">No Proxy</option>
                <option value="socks5://127.0.0.1:9050">Tor (port 9050)</option>
                <option value="socks5://127.0.0.1:9150">
                  Tor Browser (port 9150)
                </option>
                <option value="custom">Custom Proxy...</option>
              </select>
              <input
                type="text"
                id="custom-proxy"
                placeholder="socks5://host:port"
                style="margin-top: 10px; display: none"
              />
            </div>

            <button
              type="button"
              class="btn btn-secondary"
              id="fetch-formats"
              style="width: 100%; margin-bottom: 10px"
            >
              <span>🔍</span> Fetch Available Formats
            </button>

            <div id="format-selector" class="format-selector">
              <label>Select Quality</label>
              <div id="formats-list"></div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%">
              <span>⬇️</span> Start Download
            </button>
          </form>
        </div>

        <!-- Active Downloads -->
        <div class="card">
          <h2 class="card-title">
            <span class="icon">⚡</span>
            Active Downloads
          </h2>
          <div id="queue-list" class="queue-list">
            <div class="empty-state">
              <div class="empty-state-icon">📭</div>
              <p>No active downloads</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Download History -->
      <div class="card">
        <h2 class="card-title">
          <span class="icon">📚</span>
          Download History
        </h2>

        <div class="tabs">
          <div class="tab active" data-filter="all">All</div>
          <div class="tab" data-filter="video">Videos</div>
          <div class="tab" data-filter="audio">Audio</div>
        </div>

        <div id="history-list">
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <p>No download history yet</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      let selectedFormat = null;
      let currentDownloadType = "video";
      let historyFilter = "all";
      let completedJobs = new Set();

      // Show notification
      function showNotification(title, message, icon = "✅") {
        const notification = document.createElement("div");
        notification.className = "notification";
        notification.innerHTML = `
                <div class="notification-icon">${icon}</div>
                <div class="notification-content">
                    <div class="notification-title">${title}</div>
                    <div class="notification-message">${message}</div>
                </div>
            `;
        document.body.appendChild(notification);

        setTimeout(() => {
          notification.classList.add("hide");
          setTimeout(() => {
            notification.remove();
          }, 300);
        }, 3000);
      }

      // Check dependencies on load
      async function checkDependencies() {
        const response = await fetch("/api/check-dependencies");
        const data = await response.json();

        if (!data.success) {
          const alert = document.getElementById("dependencies-alert");
          alert.innerHTML = `
                    <div class="alert alert-warning">
                        <strong>⚠️ Missing Dependencies:</strong><br>
                        ${data.missing.join(", ")}<br>
                        Please install: pip install yt-dlp curl_cffi && brew install ffmpeg
                    </div>
                `;
        }
      }

      // Tab switching for download type
      document.querySelectorAll(".tabs .tab").forEach((tab) => {
        tab.addEventListener("click", function () {
          const type = this.dataset.type;
          if (type) {
            document
              .querySelectorAll(".tabs .tab")
              .forEach((t) => t.classList.remove("active"));
            this.classList.add("active");
            currentDownloadType = type;

            // Hide SponsorBlock for audio
            const sponsorBlock = document.querySelector(".checkbox-group");
            if (type === "audio") {
              sponsorBlock.style.display = "none";
            } else {
              sponsorBlock.style.display = "flex";
            }
          } else if (this.dataset.filter) {
            document
              .querySelectorAll(".tabs .tab")
              .forEach((t) => t.classList.remove("active"));
            this.classList.add("active");
            historyFilter = this.dataset.filter;
            loadHistory();
          }
        });
      });

      // Proxy selection
      document.getElementById("proxy").addEventListener("change", function () {
        const customProxy = document.getElementById("custom-proxy");
        if (this.value === "custom") {
          customProxy.style.display = "block";
        } else {
          customProxy.style.display = "none";
        }
      });

      // Fetch formats
      document
        .getElementById("fetch-formats")
        .addEventListener("click", async function () {
          const url = document.getElementById("url").value;
          if (!url) {
            alert("Please enter a URL first");
            return;
          }

          this.innerHTML = '<span class="spinner"></span> Fetching...';
          this.disabled = true;

          const proxySelect = document.getElementById("proxy");
          let proxy = proxySelect.value;
          if (proxy === "custom") {
            proxy = document.getElementById("custom-proxy").value;
          }

          try {
            const response = await fetch("/api/formats", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ url, proxy }),
            });

            const data = await response.json();

            if (data.success) {
              const formatsList = document.getElementById("formats-list");
              formatsList.innerHTML = "";

              data.formats.forEach((format) => {
                const formatItem = document.createElement("div");
                formatItem.className = "format-item";
                formatItem.innerHTML = `
                            <div style="display: flex; justify-content: space-between;">
                                <span>${format.resolution} - ${format.ext}</span>
                                <span style="color: var(--text-secondary);">${format.note}</span>
                            </div>
                        `;
                formatItem.addEventListener("click", function () {
                  document
                    .querySelectorAll(".format-item")
                    .forEach((f) => f.classList.remove("selected"));
                  this.classList.add("selected");
                  selectedFormat = format.format_id;
                });
                formatsList.appendChild(formatItem);
              });

              document
                .getElementById("format-selector")
                .classList.add("active");
            } else {
              alert("Failed to fetch formats: " + data.error);
            }
          } catch (error) {
            alert("Error: " + error.message);
          }

          this.innerHTML = "<span>🔍</span> Fetch Available Formats";
          this.disabled = false;
        });

      // Submit download
      document
        .getElementById("download-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const url = document.getElementById("url").value;
          const proxySelect = document.getElementById("proxy");
          let proxy = proxySelect.value;
          if (proxy === "custom") {
            proxy = document.getElementById("custom-proxy").value;
          }

          const data = {
            url,
            audio_only: currentDownloadType === "audio",
            use_sponsorblock:
              document.getElementById("use-sponsorblock").checked,
            proxy,
            format_id: selectedFormat || "",
          };

          const response = await fetch("/api/download", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });

          const result = await response.json();

          if (result.success) {
            // Reset form
            selectedFormat = null;
            document
              .getElementById("format-selector")
              .classList.remove("active");

            // Start polling for this job
            pollJobStatus(result.job_id);
          } else {
            alert("Failed to start download: " + result.error);
          }
        });

      // Poll job status
      function pollJobStatus(jobId) {
        const interval = setInterval(async () => {
          const response = await fetch(`/api/status/${jobId}`);
          const data = await response.json();

          if (data.success) {
            // Check if just completed
            if (data.job.status === "completed" && !completedJobs.has(jobId)) {
              completedJobs.add(jobId);
              const filename = data.job.file_info?.filename || "Download";
              showNotification("Download Complete! 🎉", filename);
              loadHistory();
            }

            updateQueueDisplay();

            if (
              data.job.status === "completed" ||
              data.job.status === "failed"
            ) {
              clearInterval(interval);
            }
          }
        }, 1000);
      }

      // Cancel download
      async function cancelDownload(jobId) {
        await fetch(`/api/cancel/${jobId}`, { method: "POST" });
        updateQueueDisplay();
      }

      // Resume download
      async function resumeDownload(jobId) {
        await fetch(`/api/resume/${jobId}`, { method: "POST" });
        updateQueueDisplay();
      }

      // Remove download
      async function removeDownload(jobId) {
        if (!confirm("Remove this download?")) return;
        await fetch(`/api/remove/${jobId}`, { method: "DELETE" });
        updateQueueDisplay();
      }

      // Update queue display
      async function updateQueueDisplay() {
        const response = await fetch("/api/queue");
        const data = await response.json();

        const queueList = document.getElementById("queue-list");

        if (Object.keys(data.queue).length === 0) {
          queueList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No active downloads</p>
                    </div>
                `;
          return;
        }

        queueList.innerHTML = "";

        for (const [jobId, job] of Object.entries(data.queue)) {
          const item = document.createElement("div");
          item.className = "queue-item";

          let actionButtons = "";
          if (job.status === "downloading") {
            actionButtons = `
                        <button class="btn btn-small btn-warning" onclick="cancelDownload('${jobId}')">⏸️ Cancel</button>
                        <button class="btn btn-small btn-danger" onclick="removeDownload('${jobId}')">🗑️ Remove</button>
                    `;
          } else if (job.status === "cancelled") {
            actionButtons = `
                        <button class="btn btn-small btn-success" onclick="resumeDownload('${jobId}')">▶️ Resume</button>
                        <button class="btn btn-small btn-danger" onclick="removeDownload('${jobId}')">🗑️ Remove</button>
                    `;
          } else if (job.status === "completed" || job.status === "failed") {
            actionButtons = `
                        <button class="btn btn-small btn-danger" onclick="removeDownload('${jobId}')">🗑️ Remove</button>
                    `;
          } else {
            actionButtons = `
                        <button class="btn btn-small btn-danger" onclick="removeDownload('${jobId}')">🗑️ Remove</button>
                    `;
          }

          item.innerHTML = `
                    <div class="queue-item-header">
                        <div class="queue-info">
                            <div class="queue-url">${job.url}</div>
                            <div class="queue-stats">
                                <div class="stat-item">
                                    <span class="stat-label">Progress</span>
                                    <span class="stat-value">${job.progress.toFixed(
                                      1
                                    )}%</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Speed</span>
                                    <span class="stat-value">${
                                      job.speed || "N/A"
                                    }</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">ETA</span>
                                    <span class="stat-value">${
                                      job.eta || "N/A"
                                    }</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Size</span>
                                    <span class="stat-value">${
                                      job.total_size || "N/A"
                                    }</span>
                                </div>
                            </div>
                        </div>
                        <span class="status-badge status-${job.status}">${
            job.status
          }</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${
                          job.progress
                        }%"></div>
                    </div>
                    <div class="queue-actions" style="margin-top: 15px;">
                        ${actionButtons}
                    </div>
                `;
          queueList.appendChild(item);
        }
      }

      // Load history
      async function loadHistory() {
        const response = await fetch("/api/history");
        const data = await response.json();

        const historyList = document.getElementById("history-list");

        let filteredHistory = data.history;
        if (historyFilter !== "all") {
          filteredHistory = data.history.filter(
            (h) => h.type === historyFilter
          );
        }

        if (filteredHistory.length === 0) {
          historyList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>No ${
                          historyFilter === "all" ? "" : historyFilter
                        } downloads yet</p>
                    </div>
                `;
          return;
        }

        historyList.innerHTML = "";

        filteredHistory.forEach((item) => {
          const historyItem = document.createElement("div");
          historyItem.className = "history-item";

          const icon = item.type === "audio" ? "🎵" : "🎬";
          const size = (item.size / 1024 / 1024).toFixed(2) + " MB";

          historyItem.innerHTML = `
                    <div class="file-icon">${icon}</div>
                    <div class="history-info">
                        <div class="history-filename">${item.filename}</div>
                        <div class="history-meta">${size} • ${item.date}</div>
                    </div>
                    <div class="history-actions">
                        <button class="btn-icon" onclick="playFile('${item.filepath}')" title="Play">▶️</button>
                        <button class="btn-icon" onclick="downloadFile('${item.filepath}')" title="Download">⬇️</button>
                        <button class="btn-icon" onclick="deleteHistory('${item.id}')" title="Delete">🗑️</button>
                    </div>
                `;

          historyList.appendChild(historyItem);
        });
      }

      // Play file in new tab
      function playFile(filepath) {
        window.open(`/api/file/${filepath}`, "_blank");
      }

      // Download file
      function downloadFile(filepath) {
        window.location.href = `/api/file/${filepath}`;
      }

      // Delete history entry
      async function deleteHistory(historyId) {
        if (!confirm("Delete this entry from history?")) return;

        await fetch(`/api/history/${historyId}`, { method: "DELETE" });
        loadHistory();
      }

      // Initialize
      checkDependencies();
      loadHistory();
      setInterval(updateQueueDisplay, 2000);
    </script>
  </body>
</html>
