<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.2px;
    }
    .subtitle {
      font-size: 10px;
      color: #64748b;
      margin-top: 1px;
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .icon-btn {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }
    .icon-btn:hover { color: #94a3b8; background: #334155; }

    /* ── Server status ── */
    .server-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      font-size: 11px;
      color: #64748b;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.online { background: #22c55e; }
    .server-url {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .open-app-btn {
      background: transparent;
      border: none;
      color: #3b82f6;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .open-app-btn:hover { background: #1e293b; }

    /* ── Empty state ── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      gap: 10px;
      color: #475569;
    }
    .empty svg { opacity: 0.4; }
    .empty p { font-size: 13px; text-align: center; line-height: 1.5; }
    .empty small { font-size: 11px; color: #334155; text-align: center; }

    /* ── Video list ── */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 6px;
    }
    .list-title {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .clear-btn {
      background: transparent;
      border: none;
      color: #475569;
      font-size: 11px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }
    .clear-btn:hover { color: #ef4444; background: #1e293b; }

    .video-list {
      max-height: 340px;
      overflow-y: auto;
      padding: 0 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .video-list::-webkit-scrollbar { width: 4px; }
    .video-list::-webkit-scrollbar-track { background: transparent; }
    .video-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    .video-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      transition: border-color 0.15s;
    }
    .video-card:hover { border-color: #475569; }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .type-badge {
      background: #1e3a5f;
      color: #60a5fa;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .type-badge.hls { background: #1a3a2e; color: #34d399; }
    .type-badge.dash { background: #3a1a3a; color: #c084fc; }
    .type-badge.dom { background: #1e293b; color: #64748b; border: 1px solid #334155; }

    .video-url {
      font-size: 11px;
      color: #94a3b8;
      word-break: break-all;
      line-height: 1.4;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .video-title {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 600;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .video-meta {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .type-badge.page { background: #1a3a2e; color: #34d399; }

    .card-actions {
      display: flex;
      gap: 6px;
    }
    .dl-btn {
      flex: 1;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .dl-btn:hover { opacity: 0.9; }
    .dl-btn:active { transform: scale(0.98); }
    .dl-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .dl-btn.success { background: linear-gradient(135deg, #065f46, #059669); }
    .dl-btn.error { background: linear-gradient(135deg, #7f1d1d, #dc2626); }

    .dl-audio-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .dl-audio-btn:hover { background: #334155; color: #e2e8f0; }
    .dl-audio-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Progress bar ── */
    .progress-wrap {
      margin-top: 6px;
    }
    .progress-track {
      background: #0f172a;
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    .progress-fill.done { background: linear-gradient(90deg, #059669, #34d399); }
    .progress-fill.error-bar { background: #dc2626; }
    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #64748b;
      margin-top: 3px;
    }
    .progress-label { font-size: 10px; color: #94a3b8; margin-top: 2px; }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid #1e293b;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #334155;
      font-size: 11px;
    }
    .footer a {
      color: #475569;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s;
    }
    .footer a:hover { color: #94a3b8; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </div>
      <div>
        <div class="title">Video Downloader</div>
        <div class="subtitle">IDM-style video capture</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" title="Rescan page">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Server status bar -->
  <div class="server-bar">
    <span class="dot" id="serverDot"></span>
    <span class="server-url" id="serverUrl">Connecting…</span>
    <button class="open-app-btn" id="openAppBtn">Open App</button>
  </div>

  <!-- Content -->
  <div id="content">
    <!-- Filled by popup.js -->
  </div>

  <!-- Footer -->
  <div class="footer">
    <span id="countLabel">No videos detected</span>
    <a id="settingsLink">Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
